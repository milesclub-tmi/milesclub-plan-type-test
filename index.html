  <head>

    />
    <meta
      name="twitter:image"
      content="https://milesclub-tmi.github.io/milesclub-plan-type-test/s/og-default.png"
    />

    />
    <style>
      @font-face {
        font-family: "NationalPension";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2310@1.0/NPSfontRegular.woff2")
          format("woff2");
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: "NationalPension";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2310@1.0/NPSfontBold.woff2")
          format("woff2");
        font-weight: 700;
        font-display: swap;
      }

      @font-face {
        font-family: "NationalPension";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2310@1.0/NPSfontExtraBold.woff2")
          format("woff2");
        font-weight: 800;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --bg: #f5ffe9;
        --surface: #ffffff;
        --surface-soft: #fbfff2;
        --text: #25312c;
        --ink: #26382b;
        --muted: #64715d;
        --line: #d7efc8;
        --lime: #58cc02;
        --lime-dark: #46a302;
        --lime-soft: #dcffbf;
        --lime-pale: #efffe3;
        --blue: #86d928;
        --blue-dark: #5fb813;
        --orange: #b7e51a;
        --orange-dark: #82bd00;
        --pink: #a9ef62;
        --shadow: 0 7px 0 #cfe8bd, 0 20px 42px rgba(38, 49, 44, 0.12);
        --radius: 28px;
        font-family:
          "NationalPension",
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        line-height: 1.55;
        word-break: keep-all;
        overflow-wrap: break-word;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        background:
          linear-gradient(180deg, rgba(88, 204, 2, 0.18), transparent 34%),
          linear-gradient(300deg, rgba(134, 217, 40, 0.16), transparent 34%),
          repeating-linear-gradient(
            135deg,
            rgba(88, 204, 2, 0.1) 0 2px,
            transparent 2px 22px
          ),
          var(--bg);
        color: var(--text);
      }

      button {
        font: inherit;
      }

      .page {
        width: min(100%, 520px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px 18px 22px;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
      }

      .panel {
        position: relative;
        width: 100%;
        overflow: hidden;
        border: 2px solid #e3f0d8;
        border-radius: 38px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .brand-footer {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 22px;
        opacity: 0.42;
        pointer-events: none;
      }

      .brand-footer img {
        display: block;
        width: clamp(88px, 22vw, 128px);
        height: auto;
      }

      .screen {
        --screen-pad: 24px;
        padding: var(--screen-pad);
      }

      .card-enter {
        animation: cardSwipeIn 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
        will-change: transform, opacity;
      }

      @keyframes cardSwipeIn {
        from {
          opacity: 0;
          transform: translateX(28px) rotate(0.7deg);
        }

        to {
          opacity: 1;
          transform: translateX(0) rotate(0);
        }
      }

      .landing {
        min-height: 640px;
        display: grid;
        align-content: space-between;
      }

      .landing-art {
        position: relative;
        min-height: 230px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: linear-gradient(
          180deg,
          #ddffd0 0%,
          #a8eb7b 52%,
          #58cc02 100%
        );
        border-bottom: 6px solid var(--lime-dark);
      }

      .landing-art::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            160deg,
            transparent 0 42%,
            rgba(255, 255, 255, 0.34) 42% 48%,
            transparent 48%
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.22) 0 2px,
            transparent 2px 42px
          );
        opacity: 0.9;
      }

      .landing-image-frame {
        position: relative;
        z-index: 1;
        width: min(calc(100% - 48px), 360px);
        height: 190px;
        overflow: hidden;
        display: grid;
        place-items: center;
        border: 7px solid var(--ink);
        border-radius: 34px;
        background: #ffffff;
        box-shadow: -20px 20px 0 rgba(88, 204, 2, 0.24);
        transform: rotate(2deg);
      }

      .landing-image {
        display: block;
        width: 100%;
        height: 100%;
        padding: 12px;
        object-fit: contain;
      }

      .hero-badge {
        position: absolute;
        right: -18px;
        top: -18px;
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--orange);
        color: #ffffff;
        font-size: 20px;
        font-weight: 800;
        box-shadow: 0 6px 0 var(--orange-dark);
        transform: rotate(-10deg);
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      .eyebrow {
        margin: 0;
        color: var(--lime-dark);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
        word-break: keep-all;
        overflow-wrap: break-word;
      }

      .title {
        font-size: 42px;
        line-height: 1.12;
        letter-spacing: 0;
        color: var(--ink);
        font-weight: 800;
        text-shadow: 0 3px 0 rgba(88, 204, 2, 0.14);
      }

      .subtitle {
        color: var(--muted);
        font-size: 17px;
        line-height: 1.68;
      }

      .micro-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 7px 11px;
        border: 2px solid #bfe8a6;
        border-radius: 999px;
        background: #f6ffef;
        color: var(--lime-dark);
        font-size: 14px;
        font-weight: 700;
      }

      .primary-btn,
      .secondary-btn,
      .ghost-btn,
      .choice-btn,
      .text-btn,
      .home-btn {
        min-height: 48px;
        border: 0;
        border-radius: var(--radius);
        cursor: pointer;
        transition:
          transform 150ms ease,
          box-shadow 150ms ease,
          border-color 150ms ease,
          background-color 150ms ease;
      }

      .primary-btn {
        width: 100%;
        padding: 16px 18px;
        background: var(--lime);
        color: #ffffff;
        font-size: 17px;
        font-weight: 800;
        box-shadow: 0 6px 0 var(--lime-dark);
      }

      .secondary-btn {
        padding: 14px 16px;
        background: var(--blue);
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 5px 0 var(--blue-dark);
      }

      .ghost-btn,
      .text-btn {
        padding: 14px 16px;
        border: 2px solid var(--line);
        background: #ffffff;
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 5px 0 #d4e8c5;
      }

      .text-btn {
        min-height: 42px;
        padding: 10px 14px;
        box-shadow: none;
      }

      .home-btn {
        width: 44px;
        height: 44px;
        min-height: 44px;
        display: grid;
        place-items: center;
        border: 2px solid #bfe8a6;
        background: #ffffff;
        color: var(--lime-dark);
        box-shadow: 0 4px 0 #cde9ba;
      }

      .home-btn svg {
        width: 23px;
        height: 23px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .primary-btn:hover,
      .secondary-btn:hover,
      .ghost-btn:hover,
      .text-btn:hover,
      .choice-btn:hover,
      .home-btn:hover {
        transform: translateY(-2px);
      }

      .primary-btn:active,
      .secondary-btn:active,
      .ghost-btn:active,
      .text-btn:active,
      .choice-btn:active,
      .home-btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(38, 50, 56, 0.18);
      }

      .primary-btn:focus-visible,
      .secondary-btn:focus-visible,
      .ghost-btn:focus-visible,
      .text-btn:focus-visible,
      .choice-btn:focus-visible,
      .home-btn:focus-visible {
        outline: 3px solid rgba(88, 204, 2, 0.38);
        outline-offset: 3px;
      }

      .question-layout {
        min-height: 640px;
        display: grid;
        gap: 18px;
        align-content: start;
        /* 진행바 sticky가 카드에 갇히지 않도록 세로는 visible.
         가로는 card-enter(translateX)가 삐져나오지 않게 clip — hidden과 달리
         clip은 스크롤 컨테이너를 만들지 않아 sticky가 그대로 동작합니다. */
        overflow: clip visible;
      }

      /* 스크롤해도 화면 상단에 붙어 진척도·홈버튼이 계속 보입니다. */
      .progress-sticky {
        position: sticky;
        top: 0;
        z-index: 3;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 14px;
        row-gap: 10px;
        margin: calc(var(--screen-pad) * -1) calc(var(--screen-pad) * -1) 0;
        padding: var(--screen-pad) var(--screen-pad) 13px;
        border-radius: 36px 36px 0 0;
        border-bottom: 1px solid #e8f4dd;
        background: var(--surface);
      }

      /* 좌측에 진행 정보 2줄, 우측에 홈버튼이 두 줄 높이로 걸칩니다. */
      .progress-sticky .progress-head {
        grid-area: 1 / 1;
      }

      .progress-sticky .progress-bar {
        grid-area: 2 / 1;
      }

      .progress-sticky .home-btn {
        grid-area: 1 / 2 / 3 / 3;
      }

      .progress-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .progress-bar {
        position: relative;
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: #dff0d4;
      }

      .progress-bar > span {
        display: block;
        width: var(--progress);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          var(--lime-dark),
          var(--lime),
          var(--blue)
        );
      }

      .question-visual,
      .result-character {
        position: relative;
        width: 100%;
        min-height: 146px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 2px solid #d9eacb;
        border-radius: var(--radius);
        background:
          linear-gradient(135deg, rgba(88, 204, 2, 0.16), transparent 45%),
          linear-gradient(315deg, rgba(134, 217, 40, 0.18), transparent 48%),
          #fbfff6;
        box-shadow: inset 0 -6px 0 rgba(88, 204, 2, 0.08);
      }

      .question-visual {
        height: 172px;
      }

      .question-visual::before,
      .result-character::before {
        content: "";
        position: absolute;
        inset: 14px;
        border-radius: 24px;
        border: 1px dashed rgba(88, 204, 2, 0.24);
        pointer-events: none;
      }

      .question-image,
      .result-image {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
      }

      .question-image {
        object-fit: cover;
      }

      .result-image {
        padding: 14px;
        object-fit: contain;
      }

      .landing-image.is-missing,
      .question-image.is-missing,
      .result-image.is-missing {
        display: none;
      }

      .question-title {
        font-size: 24px;
        line-height: 1.34;
        letter-spacing: 0;
        color: var(--ink);
        text-align: center;
        font-weight: 800;
      }

      .choice-list {
        display: grid;
        gap: 10px;
      }

      .choice-btn {
        width: 100%;
        min-height: 66px;
        padding: 14px;
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        align-items: center;
        border: 2px solid var(--line);
        background: #ffffff;
        color: var(--text);
        text-align: left;
        box-shadow: 0 5px 0 #d4e8c5;
      }

      .choice-btn:hover,
      .choice-btn[aria-pressed="true"] {
        border-color: var(--lime);
        background: var(--surface-soft);
      }

      .choice-key {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--lime);
        color: #ffffff;
        font-weight: 800;
        font-size: 14px;
        box-shadow: 0 3px 0 var(--lime-dark);
      }

      .choice-text {
        font-size: 15px;
        line-height: 1.5;
        font-weight: 600;
      }

      .loading-layout {
        min-height: 600px;
        display: grid;
        place-items: center;
        text-align: center;
      }

      .loading-card {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .loader {
        width: 108px;
        height: 108px;
        display: grid;
        place-items: center;
        border-radius: 36px;
        background: var(--lime);
        box-shadow: 0 8px 0 var(--lime-dark);
        animation: bounce 850ms ease-in-out infinite alternate;
      }

      @keyframes bounce {
        from {
          transform: translateY(0) rotate(-2deg);
        }
        to {
          transform: translateY(-8px) rotate(2deg);
        }
      }

      .loader svg {
        width: 66px;
        height: 66px;
      }

      .loading-list {
        display: grid;
        gap: 8px;
        padding: 0;
        margin: 0;
        list-style: none;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      .result {
        display: grid;
        gap: 24px;
      }

      .result-hero {
        display: grid;
        gap: 13px;
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(88, 204, 2, 0.28), transparent 44%),
          linear-gradient(310deg, rgba(134, 217, 40, 0.2), transparent 44%),
          #f5fff0;
        border-bottom: 2px solid var(--line);
      }

      /* 결과 요약(1뎁스): 유저가 먼저 보는 정체성 카드 */
      .result-summary {
        display: grid;
        justify-items: center;
        text-align: center;
        gap: 14px;
        padding: 28px 24px 26px;
        background:
          linear-gradient(135deg, rgba(88, 204, 2, 0.26), transparent 46%),
          linear-gradient(310deg, rgba(134, 217, 40, 0.2), transparent 46%),
          #f5fff0;
      }

      .result-summary:not(:last-child) {
        border-bottom: 2px solid var(--line);
      }

      .result-summary > * {
        max-width: 100%;
      }

      .result-summary .result-character {
        width: 100%;
      }

      .summary-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        align-items: center;
      }

      .result-summary .result-title {
        font-size: 33px;
        margin-top: 2px;
      }

      .result-summary .meme-copy {
        font-size: 16px;
        padding: 13px 16px;
        box-shadow: 0 4px 0 #e4f4d4;
      }

      .summary-actions {
        display: grid;
        gap: 10px;
        width: 100%;
        margin-top: 6px;
      }

      .summary-share {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .summary-actions .text-btn {
        justify-self: center;
        color: var(--muted);
      }

      /* 상세(2뎁스): 자세히 보기를 눌러야 펼쳐짐 */
      .result-detail {
        animation: detailReveal 300ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      @keyframes detailReveal {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .result-detail {
          animation: none;
        }
      }

      .result-character {
        min-height: 176px;
      }

      .result-image {
        height: auto;
        aspect-ratio: 1/1;
      }

      .result-code {
        width: max-content;
        padding: 8px 11px;
        border: 2px solid var(--lime);
        border-radius: 999px;
        background: #ffffff;
        color: var(--lime-dark);
        font-size: 13px;
        font-weight: 800;
      }

      .result-title {
        font-size: 36px;
        line-height: 1.15;
        letter-spacing: 0;
        color: var(--ink);
        font-weight: 800;
      }

      .meme-copy {
        padding: 12px 14px;
        border: 2px solid #bfe8a6;
        border-radius: 20px;
        background: #ffffff;
        color: var(--lime-dark);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.5;
      }

      .rarity-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: max-content;
        padding: 7px 13px;
        border-radius: 999px;
        background: #26382b;
        color: #eaffd4;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .rarity-badge b {
        color: #b7ff6b;
      }

      .sniper-list {
        display: grid;
        gap: 9px;
        padding: 15px 16px;
        margin: 0;
        list-style: none;
        border: 2px dashed #bfe8a6;
        border-radius: 20px;
        background: #f8fff1;
      }

      .sniper-list li {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 9px;
        align-items: start;
        color: var(--ink);
        font-size: 15px;
        line-height: 1.5;
        font-weight: 700;
      }

      .sniper-list li::before {
        content: "☑";
        color: var(--lime-dark);
        font-size: 17px;
        line-height: 1.4;
      }

      .match-grid {
        display: grid;
        gap: 10px;
      }

      .match-card {
        display: grid;
        gap: 3px;
        padding: 14px 15px;
        border-radius: 20px;
        border: 2px solid var(--line);
        background: #ffffff;
      }

      .match-card.is-match {
        border-color: var(--lime);
        background: #f4ffe9;
      }

      .match-card.is-clash {
        border-color: #edcba0;
        background: #fff7ef;
      }

      .match-card .match-role {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .match-card.is-match .match-role {
        color: var(--lime-dark);
      }

      .match-card.is-clash .match-role {
        color: #c9762a;
      }

      .match-card .match-name {
        font-size: 16px;
        font-weight: 800;
        color: var(--ink);
      }

      .match-card .match-note {
        font-size: 14px;
        line-height: 1.5;
        font-weight: 600;
        color: var(--muted);
      }

      .type-gallery {
        display: grid;
        gap: 8px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .type-gallery li {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: baseline;
        padding: 11px 13px;

      function calculateResult(answers) {
        const scores = createEmptyScores();
        const signals = createEmptySignals();

        answers.forEach((item) => {
          const question = questions.find(
            (candidate) => candidate.id === item.questionId,
          );
          const answer = question.answers.find(
            (candidate) => candidate.key === item.answerKey,
          );

          AXES.forEach((axis) => {
            scores[axis] += answer.score[axis] || 0;
          });

          Object.entries(answer.signal || {}).forEach(([key, value]) => {
            signals[key] = (signals[key] || 0) + value;
          });
        });

        const normalized = normalizeScores(scores);
        // 가중치는 6개 유형 분포가 특정 유형에 쏠리지 않도록 시뮬레이션으로 튜닝됨(11~22% 범위).
        const resultScores = {
          WIFI_MINIMALIST:
            (6 - normalized.dataNeed) * 1.35 +
            normalized.priceSensitivity * 0.7 +
            (signals.lowData || 0) * 1.7,
          SHORT_FORM_HEAVY_USER:
            normalized.dataNeed * 1.35 + (signals.videoHeavy || 0) * 2.3,
          PLAN_NEGLECTER:
            (5 - normalized.awareness) * 0.95 +
            (5 - normalized.switchingPropensity) * 0.6 +
            (signals.neglect || 0) * 1.7 +
            (signals.friction || 0) * 0.5,
          REWARD_OPTIMIZER:
            normalized.rewardSensitivity * 1.55 + (signals.reward || 0) * 1.5,
          UNLIMITED_STABILITY_SEEKER:
            normalized.dataNeed * 1.2 +
            (signals.unlimited || 0) * 1.7 +
            (signals.stabilityConcern || 0) * 1.5,
          MVNO_POWER_USER:
            normalized.priceSensitivity * 0.9 +
            normalized.switchingPropensity * 1.0 +
            normalized.awareness * 0.5 +
            (signals.promoHunter || 0) * 1.6,
        };

        const maxScore = Math.max(...Object.values(resultScores));
        const resultCode = RESULT_PRIORITY.find(
          (code) => resultScores[code] === maxScore,
        );

        return {
          scores: normalized,
          signals,
          resultScores,
          resultCode,
        };
      }

      function normalizeScores(rawScores) {
        const ranges = {
          dataNeed: [0, 16],
          priceSensitivity: [0, 13],
          rewardSensitivity: [0, 16],
          switchingPropensity: [-4, 12],
          awareness: [-5, 12],
        };

        return AXES.reduce((scores, axis) => {
          const [min, max] = ranges[axis];
          const value = Math.round(((rawScores[axis] - min) / (max - min)) * 5);
          scores[axis] = Math.min(5, Math.max(1, value || 1));
          return scores;
        }, {});
      }

      function rarityLabel(rarity) {

        return rarity <= 15

      function renderQuestionVisual(question) {
        const imageSrc =
          QUESTION_IMAGE_SLOTS[question.visual] || QUESTION_IMAGE_SLOTS.data;

        </div>

      function renderResultCharacter(resultCode) {
        const imageSrc =
          RESULT_IMAGE_SLOTS[resultCode] || RESULT_IMAGE_SLOTS.PLAN_NEGLECTER;

        return `
        <div class="result-character" aria-hidden="true" data-image-slot="${resultCode}">
          <img

      async function shareResult() {
        const result = results[state.result];
        const shareUrl = getResultShareUrl();
        const text = `${result.shareText}\n\n너는 무슨 타입인지 해봐: ${shareUrl}`;
        trackEvent(
          "result_shared",
          buildInteractionPayload({ channel: "native_or_clipboard" }),
        );

        if (navigator.share) {
          try {
            await navigator.share({
              title: `${result.title} | 내 요금제는 무슨 타입?`,
              text: result.shareText,
              url: shareUrl,
            });
            return;
          } catch (error) {
            if (error.name === "AbortError") return;
          }
        }

        try {
          await copyText(text);
          showToast("결과 공유 문구가 복사됐어요");
        } catch (error) {
          showToast("복사가 어려워요. 공유 링크 복사를 이용해 주세요.");
        }
      }

      async function saveResultImage() {
        const result = results[state.result];
        trackEvent(
          "result_image_saved",
          buildInteractionPayload({ resultType: result.code }),
        );

        try {
          const blob = await createResultImageBlob(result);
          downloadBlob(blob, `milesclub-${result.code}.png`);
          showToast("결과 이미지가 저장됐어요");
        } catch (error) {
          showToast("이미지 생성이 어려워요. 결과 공유하기를 이용해 주세요.");
        }
      }

      function handlePlanClick() {
        const result = results[state.result];
        trackEvent(
          "plan_cta_clicked",
          buildInteractionPayload({ resultType: result.code }),
        );

        if (PLAN_DETAIL_URL === "#") {
          showToast("요금제 상세 페이지 주소를 연결하면 여기서 전환됩니다.");
          return;
        }

        const url = new URL(PLAN_DETAIL_URL, window.location.href);
        url.searchParams.set("utm_source", "plan_type_test");
        url.searchParams.set("utm_medium", "result_cta");
        url.searchParams.set("utm_campaign", "plan_type_test");
        url.searchParams.set("utm_content", result.code);
        url.searchParams.set("resultType", result.code);
        url.searchParams.set("version", CONTENT_VERSION);
        window.location.href = url.toString();
      }

      function getBaseUrl() {
        try {
          const url = new URL(window.location.href);
          url.search = "";
          url.hash = "";
          return url.toString();
        } catch (error) {
          return window.location.href.split("?")[0].split("#")[0];
        }
      }

      function getShareUrl() {
        const url = new URL(getBaseUrl());
        url.searchParams.set("utm_source", "share");
        url.searchParams.set("utm_campaign", "plan_type_test");
        return url.toString();
      }

      // 결과 공유는 유형별 공유 페이지(s/CODE.html)로 — 카톡/SNS 미리보기에 유형별
      // OG 카드가 뜨도록. 링크를 연 사람은 그 페이지에서 랜딩으로 넘어가 직접 테스트합니다.
      function getResultShareUrl() {
        if (!state.result) return getShareUrl();
        const url = new URL(`s/${state.result}.html`, getBaseUrl());
        url.searchParams.set("utm_source", "share");
        url.searchParams.set("utm_campaign", "plan_type_test");
        return url.toString();
      }

      function buildCompletionPayload(calculated, answers) {
        return {
          runId: state.runId,
          contentVersion: CONTENT_VERSION,
          resultType: calculated.resultCode,
          resultTitle: results[calculated.resultCode].title,
          scores: calculated.scores,
          resultScores: calculated.resultScores,
          answers: answers.map((answer) => ({
            questionId: answer.questionId,
            answer: answer.answerKey,
          })),
          utm: getUtmParams(),
        };
      }

      function buildInteractionPayload(extra = {}) {
        return {
          runId: state.runId,
          contentVersion: CONTENT_VERSION,
          resultType: state.result,
          resultTitle: state.result ? results[state.result].title : null,
          utm: getUtmParams(),
          ...extra,
        };
      }

      function getUtmParams() {
        const params = new URLSearchParams(window.location.search);
        return [
          "utm_source",
          "utm_medium",
          "utm_campaign",
          "utm_content",
          "utm_term",
        ].reduce((utm, key) => {
          if (params.has(key)) {
            utm[key] = params.get(key);
          }
          return utm;
        }, {});
      }

      function trackEvent(eventName, payload = {}) {
        const event = {
          eventName,
          occurredAt: new Date().toISOString(),
          contentVersion: CONTENT_VERSION,
          ...payload,
        };

        persistEvent(event);

        if (!ANALYTICS_ENDPOINT) return;

        const body = JSON.stringify(event);
        if (navigator.sendBeacon) {
          navigator.sendBeacon(
            ANALYTICS_ENDPOINT,
            new Blob([body], { type: "application/json" }),
          );
          return;
        }

        fetch(ANALYTICS_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
          keepalive: true,
        }).catch(() => {});
      }

      function persistEvent(event) {
        try {
          const key = "milesclub-plan-type-test-events";
          const previous = JSON.parse(localStorage.getItem(key) || "[]");
          localStorage.setItem(
            key,
            JSON.stringify([...previous, event].slice(-40)),
          );
        } catch (error) {
          // Local QA logging is best-effort only.
        }
      }

      // 캐릭터 SVG는 data URI로 바꿔서 그립니다. 캔버스가 오염되지 않아 toBlob이 항상 성공하고,
      // file:// 로 열어 fetch가 막히는 경우엔 null을 돌려 캐릭터 없이 저장됩니다.
      async function loadResultCharacter(resultCode) {
        const src = RESULT_IMAGE_SLOTS[resultCode];
        if (!src) return null;

        try {
          const response = await fetch(src);
          if (!response.ok) return null;
          let markup = await response.text();
          // viewBox만 있는 SVG는 일부 브라우저에서 drawImage 크기를 못 잡습니다.
          if (!/<svg[^>]*\swidth=/.test(markup)) {
            markup = markup.replace(/<svg\b/, '<svg width="240" height="240"');
          }
          const dataUri = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(markup)}`;

          return await new Promise((resolve) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => resolve(null);
            image.src = dataUri;
          });
        } catch (error) {
          return null;
        }
      }

      async function createResultImageBlob(result) {
        if (document.fonts?.ready) {
          await document.fonts.ready;
        }

        const character = await loadResultCharacter(result.code);
        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1350;
        const ctx = canvas.getContext("2d");
        ctx.textBaseline = "alphabetic";

        // 배경: 라임 그라디언트
        const bg = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        bg.addColorStop(0, "#eaffd4");
        bg.addColorStop(1, "#7fd42a");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 카드
        const cardX = 66;
        const cardW = 948;
        ctx.fillStyle = "#ffffff";
        roundRect(ctx, cardX, 70, cardW, 1210, 56);
        ctx.fill();
        ctx.fillStyle = "#58cc02";
        roundRect(ctx, cardX, 70, cardW, 30, 15);
        ctx.fill();

        const padX = cardX + 64;
        const contentW = cardW - 128;
        let y = 200;

        // 캐릭터: 카드 우측 상단. 아래 타이틀(y≈386)보다 위에서 끝나 겹치지 않습니다.
        if (character) {
          const size = 180;
          const charX = cardX + cardW - 64 - size;
          const charY = 170;
          ctx.fillStyle = "#f2ffe4";
          ctx.beginPath();
          ctx.arc(
            charX + size / 2,
            charY + size / 2,
            size / 2 + 12,
            0,
            Math.PI * 2,
          );
          ctx.fill();
          ctx.drawImage(character, charX, charY, size, size);
        }

        // 상단 라벨
        ctx.fillStyle = "#46a302";
        ctx.font = "700 34px NationalPension, system-ui, sans-serif";
        ctx.fillText("마일스클럽 요금제 타입 테스트", padX, y);
        y += 30;

        // 희귀도 배지
        if (result.rarity) {
          const badgeText =
            result.rarity <= 15
              ? `상위 ${result.rarity}% 희귀 타입`
              : `참여자 ${result.rarity}%가 이 타입`;
          drawCanvasPill(
            ctx,
            padX,
            y,
            badgeText,
            "#26382b",
            "#c9ff8f",
            "800 32px NationalPension, system-ui, sans-serif",
          );
          y += 96;
        } else {
          y += 24;
        }

        // 타이틀
        ctx.fillStyle = "#243024";
        ctx.font = "800 84px NationalPension, system-ui, sans-serif";
        y = drawWrappedCanvasText(
          ctx,
          result.title,
          padX,
          y + 60,
          contentW,
          96,
        );
        y += 24;

        // 밈 카피 (말풍선)
        ctx.font = "700 42px NationalPension, system-ui, sans-serif";
        const memeLines = wrapCanvasLines(
          ctx,
          `“${result.meme}”`,
          contentW - 56,
        );
        const memeBoxH = memeLines.length * 56 + 56;
        ctx.fillStyle = "#f2ffe4";
        roundRect(ctx, padX, y, contentW, memeBoxH, 28);
        ctx.fill();
        ctx.fillStyle = "#3f8f00";
        memeLines.forEach((line, i) =>
          ctx.fillText(line, padX + 28, y + 68 + i * 56),
        );
        y += memeBoxH + 44;

        // 저격 체크리스트
        if (result.sniper?.length) {
          ctx.fillStyle = "#46a302";
          ctx.font = "800 34px NationalPension, system-ui, sans-serif";
          ctx.fillText("혹시 이런 사람?", padX, y);
          y += 56;
          ctx.font = "700 36px NationalPension, system-ui, sans-serif";
          result.sniper.forEach((item) => {
            ctx.fillStyle = "#58cc02";
            ctx.fillText("✓", padX, y);
            ctx.fillStyle = "#3a463a";
            const lines = wrapCanvasLines(ctx, item, contentW - 52);
            lines.forEach((line, i) =>
              ctx.fillText(line, padX + 52, y + i * 48),
            );
            y += lines.length * 48 + 14;
          });
          y += 18;
        }

        // 하단 절약 훅 스트립
        ctx.fillStyle = "#58cc02";
        roundRect(ctx, padX, y, contentW, 92, 46);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 38px NationalPension, system-ui, sans-serif";
        ctx.fillText("내 요금제는 무슨 타입?", padX + 40, y + 58);

        // 푸터
        ctx.fillStyle = "#5b6b52";
        ctx.font = "700 30px NationalPension, system-ui, sans-serif";
        ctx.fillText("마일스클럽 · 30초 타입 테스트", padX, 1228);

        return new Promise((resolve, reject) => {
          canvas.toBlob(
            (blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error("image generation failed"));
              }
            },
            "image/png",
            0.95,
          );
        });
      }

      function drawCanvasPill(ctx, x, y, text, bg, fg, font) {
        ctx.font = font;
        const padInner = 28;
        const height = 62;
        const width = ctx.measureText(text).width + padInner * 2;
        ctx.fillStyle = bg;
        roundRect(ctx, x, y, width, height, height / 2);
        ctx.fill();
        ctx.fillStyle = fg;
        const prevBaseline = ctx.textBaseline;
        ctx.textBaseline = "middle";
        ctx.fillText(text, x + padInner, y + height / 2 + 2);
        ctx.textBaseline = prevBaseline;
        return width;
      }

      function roundRect(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function wrapCanvasLines(ctx, text, maxWidth) {
        const lines = [];
        String(text)
          .split("\n")
          .forEach((paragraph) => {
            let line = "";
            for (const ch of paragraph) {
              const test = line + ch;
              if (ctx.measureText(test).width > maxWidth && line) {
                lines.push(line);
                line = ch === " " ? "" : ch;
              } else {
                line = test;
              }
            }
            lines.push(line);
          });
        return lines;
      }

      function drawWrappedCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
        const lines = wrapCanvasLines(ctx, text, maxWidth);
        lines.forEach((line, index) => {
          ctx.fillText(line, x, y + index * lineHeight);
        });
        return y + lines.length * lineHeight;
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
        URL.revokeObjectURL(url);
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }

        return new Promise((resolve, reject) => {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.setAttribute("readonly", "");
          textArea.style.position = "fixed";
          textArea.style.top = "-1000px";
          textArea.style.opacity = "0";
          document.body.appendChild(textArea);
          textArea.select();

          const copied = document.execCommand("copy");
          document.body.removeChild(textArea);

          if (copied) {
            resolve();
          } else {
            reject(new Error("copy failed"));
          }
        });
      }

      function createRunId() {
        if (window.crypto?.randomUUID) {
          return window.crypto.randomUUID();
        }
        return `run-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          toast.classList.remove("is-visible");
        }, 2200);
      }
    </script>
  </body>
</html>
