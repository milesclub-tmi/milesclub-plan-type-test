  <head>
    <meta charset="utf-8" />

    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="내 요금제는 무슨 타입?" />

    <meta name="twitter:title" content="내 요금제는 무슨 타입?" />
    <meta

    />
    <meta
      name="twitter:image"
      content="https://milesclub-tmi.github.io/milesclub-plan-type-test/s/og-default.png"
    />
    <meta name="theme-color" content="#58cc02" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <link

      crossorigin
      href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2310@1.0/NPSfontExtraBold.woff2"
    />
    <style>
      @font-face {
        font-family: "NationalPension";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2310@1.0/NPSfontRegular.woff2")
          format("woff2");
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: "NationalPension";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2310@1.0/NPSfontBold.woff2")
          format("woff2");
        font-weight: 700;
        font-display: swap;
      }

      @font-face {
        font-family: "NationalPension";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2310@1.0/NPSfontExtraBold.woff2")
          format("woff2");
        font-weight: 800;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --bg: #f5ffe9;
        --surface: #ffffff;
        --surface-soft: #fbfff2;
        --text: #25312c;
        --ink: #26382b;
        --muted: #64715d;
        --line: #d7efc8;
        --lime: #58cc02;
        --lime-dark: #46a302;
        --lime-soft: #dcffbf;
        --lime-pale: #efffe3;
        --blue: #86d928;
        --blue-dark: #5fb813;
        --orange: #b7e51a;
        --orange-dark: #82bd00;
        --pink: #a9ef62;
        --shadow: 0 7px 0 #cfe8bd, 0 20px 42px rgba(38, 49, 44, 0.12);
        --radius: 28px;
        font-family:
          "NationalPension",
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        line-height: 1.55;
        word-break: keep-all;
        overflow-wrap: break-word;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        background:
          linear-gradient(180deg, rgba(88, 204, 2, 0.18), transparent 34%),
          linear-gradient(300deg, rgba(134, 217, 40, 0.16), transparent 34%),
          repeating-linear-gradient(
            135deg,
            rgba(88, 204, 2, 0.1) 0 2px,
            transparent 2px 22px
          ),
          var(--bg);
        color: var(--text);
      }

      button {
        font: inherit;
      }

      .page {
        width: min(100%, 520px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px 18px 22px;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
      }

      .panel {
        position: relative;
        width: 100%;
        overflow: hidden;
        border: 2px solid #e3f0d8;
        border-radius: 38px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .brand-footer {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 22px;
        opacity: 0.42;
        pointer-events: none;
      }

      .brand-footer img {
        display: block;
        width: clamp(88px, 22vw, 128px);
        height: auto;
      }

      .screen {
        --screen-pad: 24px;
        padding: var(--screen-pad);
      }

      .card-enter {
        animation: cardSwipeIn 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
        will-change: transform, opacity;
      }

      @keyframes cardSwipeIn {
        from {
          opacity: 0;
          transform: translateX(28px) rotate(0.7deg);
        }

        to {
          opacity: 1;
          transform: translateX(0) rotate(0);
        }
      }

      .landing {
        min-height: 640px;
        display: grid;
        align-content: space-between;
      }

      .landing-art {
        position: relative;
        min-height: 230px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: linear-gradient(
          180deg,
          #ddffd0 0%,
          #a8eb7b 52%,
          #58cc02 100%
        );
        border-bottom: 6px solid var(--lime-dark);
      }

      .landing-art::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            160deg,
            transparent 0 42%,
            rgba(255, 255, 255, 0.34) 42% 48%,
            transparent 48%
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.22) 0 2px,
            transparent 2px 42px
          );
        opacity: 0.9;
      }

      .landing-image-frame {
        position: relative;
        z-index: 1;
        width: min(calc(100% - 48px), 360px);
        height: 190px;
        overflow: hidden;
        display: grid;
        place-items: center;
        border: 7px solid var(--ink);
        border-radius: 34px;
        background: #ffffff;
        box-shadow: -20px 20px 0 rgba(88, 204, 2, 0.24);
        transform: rotate(2deg);
      }

      .landing-image {
        display: block;
        width: 100%;
        height: 100%;
        padding: 12px;
        object-fit: contain;
      }

      .hero-badge {
        position: absolute;
        right: -18px;
        top: -18px;
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--orange);
        color: #ffffff;
        font-size: 20px;
        font-weight: 800;
        box-shadow: 0 6px 0 var(--orange-dark);
        transform: rotate(-10deg);
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      .eyebrow {
        margin: 0;
        color: var(--lime-dark);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
        word-break: keep-all;
        overflow-wrap: break-word;
      }

      .title {
        font-size: 42px;
        line-height: 1.12;
        letter-spacing: 0;
        color: var(--ink);
        font-weight: 800;
        text-shadow: 0 3px 0 rgba(88, 204, 2, 0.14);
      }

      .subtitle {
        color: var(--muted);
        font-size: 17px;
        line-height: 1.68;
      }

      .micro-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 7px 11px;
        border: 2px solid #bfe8a6;
        border-radius: 999px;
        background: #f6ffef;
        color: var(--lime-dark);
        font-size: 14px;
        font-weight: 700;
      }

      .primary-btn,
      .secondary-btn,
      .ghost-btn,
      .choice-btn,
      .text-btn,
      .home-btn {
        min-height: 48px;
        border: 0;
        border-radius: var(--radius);
        cursor: pointer;
        transition:
          transform 150ms ease,
          box-shadow 150ms ease,
          border-color 150ms ease,
          background-color 150ms ease;
      }

      .primary-btn {
        width: 100%;
        padding: 16px 18px;
        background: var(--lime);
        color: #ffffff;
        font-size: 17px;
        font-weight: 800;
        box-shadow: 0 6px 0 var(--lime-dark);
      }

      .secondary-btn {
        padding: 14px 16px;
        background: var(--blue);
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 5px 0 var(--blue-dark);
      }

      .ghost-btn,
      .text-btn {
        padding: 14px 16px;
        border: 2px solid var(--line);
        background: #ffffff;
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 5px 0 #d4e8c5;
      }

      .text-btn {
        min-height: 42px;
        padding: 10px 14px;
        box-shadow: none;
      }

      .home-btn {
        width: 44px;
        height: 44px;
        min-height: 44px;
        display: grid;
        place-items: center;
        border: 2px solid #bfe8a6;
        background: #ffffff;
        color: var(--lime-dark);
        box-shadow: 0 4px 0 #cde9ba;
      }

      .home-btn svg {
        width: 23px;
        height: 23px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .primary-btn:hover,
      .secondary-btn:hover,
      .ghost-btn:hover,
      .text-btn:hover,
      .choice-btn:hover,
      .home-btn:hover {
        transform: translateY(-2px);
      }

      .primary-btn:active,
      .secondary-btn:active,
      .ghost-btn:active,
      .text-btn:active,
      .choice-btn:active,
      .home-btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(38, 50, 56, 0.18);
      }

      .primary-btn:focus-visible,
      .secondary-btn:focus-visible,
      .ghost-btn:focus-visible,
      .text-btn:focus-visible,
      .choice-btn:focus-visible,
      .home-btn:focus-visible {
        outline: 3px solid rgba(88, 204, 2, 0.38);
        outline-offset: 3px;
      }

      .question-layout {
        min-height: 640px;
        display: grid;
        gap: 18px;
        align-content: start;
        /* 진행바 sticky가 카드에 갇히지 않도록 세로는 visible.
         가로는 card-enter(translateX)가 삐져나오지 않게 clip — hidden과 달리
         clip은 스크롤 컨테이너를 만들지 않아 sticky가 그대로 동작합니다. */
        overflow: clip visible;
      }

      /* 스크롤해도 화면 상단에 붙어 진척도·홈버튼이 계속 보입니다. */
      .progress-sticky {
        position: sticky;
        top: 0;
        z-index: 3;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 14px;
        row-gap: 10px;
        margin: calc(var(--screen-pad) * -1) calc(var(--screen-pad) * -1) 0;
        padding: var(--screen-pad) var(--screen-pad) 13px;
        border-radius: 36px 36px 0 0;
        border-bottom: 1px solid #e8f4dd;
        background: var(--surface);
      }

      /* 좌측에 진행 정보 2줄, 우측에 홈버튼이 두 줄 높이로 걸칩니다. */
      .progress-sticky .progress-head {
        grid-area: 1 / 1;
      }

      .progress-sticky .progress-bar {
        grid-area: 2 / 1;
      }

      .progress-sticky .home-btn {
        grid-area: 1 / 2 / 3 / 3;
      }

      .progress-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .progress-bar {
        position: relative;
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: #dff0d4;
      }

      .progress-bar > span {
        display: block;
        width: var(--progress);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          var(--lime-dark),
          var(--lime),
          var(--blue)
        );
      }

      .question-visual,
      .result-character {
        position: relative;
        width: 100%;
        min-height: 146px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 2px solid #d9eacb;
        border-radius: var(--radius);
        background:
          linear-gradient(135deg, rgba(88, 204, 2, 0.16), transparent 45%),
          linear-gradient(315deg, rgba(134, 217, 40, 0.18), transparent 48%),
          #fbfff6;
        box-shadow: inset 0 -6px 0 rgba(88, 204, 2, 0.08);
      }

      .question-visual {
        height: 172px;
      }

      .question-visual::before,
      .result-character::before {
        content: "";
        position: absolute;
        inset: 14px;
        border-radius: 24px;
        border: 1px dashed rgba(88, 204, 2, 0.24);
        pointer-events: none;
      }

      .question-image,
      .result-image {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
      }

      .question-image {
        object-fit: cover;
      }

      .result-image {
        padding: 14px;
        object-fit: contain;
      }

      .landing-image.is-missing,
      .question-image.is-missing,
      .result-image.is-missing {
        display: none;
      }

      .question-title {
        font-size: 24px;
        line-height: 1.34;
        letter-spacing: 0;
        color: var(--ink);
        text-align: center;
        font-weight: 800;
      }

      .choice-list {
        display: grid;
        gap: 10px;
      }

      .choice-btn {
        width: 100%;
        min-height: 66px;
        padding: 14px;
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        align-items: center;
        border: 2px solid var(--line);
        background: #ffffff;
        color: var(--text);
        text-align: left;
        box-shadow: 0 5px 0 #d4e8c5;
      }

      .choice-btn:hover,
      .choice-btn[aria-pressed="true"] {
        border-color: var(--lime);
        background: var(--surface-soft);
      }

      .choice-key {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--lime);
        color: #ffffff;
        font-weight: 800;
        font-size: 14px;
        box-shadow: 0 3px 0 var(--lime-dark);
      }

      .choice-text {
        font-size: 15px;
        line-height: 1.5;
        font-weight: 600;
      }

      .loading-layout {
        min-height: 600px;
        display: grid;
        place-items: center;
        text-align: center;
      }

      .loading-card {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .loader {
        width: 108px;
        height: 108px;
        display: grid;
        place-items: center;
        border-radius: 36px;
        background: var(--lime);
        box-shadow: 0 8px 0 var(--lime-dark);
        animation: bounce 850ms ease-in-out infinite alternate;
      }

      @keyframes bounce {
        from {
          transform: translateY(0) rotate(-2deg);
        }
        to {
          transform: translateY(-8px) rotate(2deg);
        }
      }

      .loader svg {
        width: 66px;
        height: 66px;
      }

      .loading-list {
        display: grid;
        gap: 8px;
        padding: 0;
        margin: 0;
        list-style: none;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      .result {
        display: grid;
        gap: 24px;
      }

      .result-hero {
        display: grid;
        gap: 13px;
        padding: 24px;
        background:
          linear-gradient(135deg, rgba(88, 204, 2, 0.28), transparent 44%),
          linear-gradient(310deg, rgba(134, 217, 40, 0.2), transparent 44%),
          #f5fff0;
        border-bottom: 2px solid var(--line);
      }

      /* 결과 요약(1뎁스): 유저가 먼저 보는 정체성 카드 */
      .result-summary {
        display: grid;
        justify-items: center;
        text-align: center;
        gap: 14px;
        padding: 28px 24px 26px;
        background:
          linear-gradient(135deg, rgba(88, 204, 2, 0.26), transparent 46%),
          linear-gradient(310deg, rgba(134, 217, 40, 0.2), transparent 46%),
          #f5fff0;
      }

      .result-summary:not(:last-child) {
        border-bottom: 2px solid var(--line);
      }

      .result-summary > * {
        max-width: 100%;
      }

      .result-summary .result-character {
        width: 100%;
      }

      .summary-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        align-items: center;
      }

      .result-summary .result-title {
        font-size: 33px;
        margin-top: 2px;
      }

      .result-summary .meme-copy {
        font-size: 16px;
        padding: 13px 16px;
        box-shadow: 0 4px 0 #e4f4d4;
      }

      .summary-actions {
        display: grid;
        gap: 10px;
        width: 100%;
        margin-top: 6px;
      }

      .summary-share {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .summary-actions .text-btn {
        justify-self: center;
        color: var(--muted);
      }

      /* 상세(2뎁스): 자세히 보기를 눌러야 펼쳐짐 */
      .result-detail {
        animation: detailReveal 300ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      @keyframes detailReveal {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .result-detail {
          animation: none;
        }
      }

      .result-character {
        min-height: 176px;
      }

      .result-image {
        height: auto;
        aspect-ratio: 1/1;
      }

      .result-code {
        width: max-content;
        padding: 8px 11px;
        border: 2px solid var(--lime);
        border-radius: 999px;
        background: #ffffff;
        color: var(--lime-dark);
        font-size: 13px;
        font-weight: 800;
      }

      .result-title {
        font-size: 36px;
        line-height: 1.15;
        letter-spacing: 0;
        color: var(--ink);
        font-weight: 800;
      }

      .meme-copy {
        padding: 12px 14px;
        border: 2px solid #bfe8a6;
        border-radius: 20px;
        background: #ffffff;
        color: var(--lime-dark);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.5;
      }

      .rarity-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: max-content;
        padding: 7px 13px;
        border-radius: 999px;
        background: #26382b;
        color: #eaffd4;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .rarity-badge b {
        color: #b7ff6b;
      }

      .plan-list {
        display: grid;
        gap: 10px;
      }

      .plan-card {
        display: grid;
        gap: 4px;
        padding: 16px;
        border: 2px solid var(--line);
        border-radius: 24px;
        background: #ffffff;
        color: inherit;
        text-decoration: none;
      }

      .plan-name {
        color: var(--ink);
        font-size: 17px;
        font-weight: 800;
      }

      .plan-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .plan-tags span {
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--lime-pale);
        color: var(--lime-dark);
        font-size: 12px;
        font-weight: 800;
      }

      .plan-price {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
        margin-top: 4px;
      }

      .plan-price b {
        color: var(--lime-dark);
        font-size: 20px;
        font-weight: 800;
      }

      /* 프로모션 종료 후 요금. 할인가만 보고 가입했다 놀라는 일이 없도록 같이 보여준다. */
      .plan-after {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .plan-spec {
        color: var(--ink);
        font-size: 14px;
        line-height: 1.5;
        font-weight: 700;
      }

      /* 속도 보장이 없는 요금제는 소진 후 추가 과금된다.
         사용량을 잘 안 챙기는 사람에게 특히 중요한 정보라 눈에 띄게 둔다. */
      .plan-caution {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 2px;
        color: #b3541e;
        font-size: 13px;
        font-weight: 700;
      }

      .plan-caution::before {

        MVNO_POWER_USER: {

          description:

          stats: {

          cta: "지금 할인 중인 요금제 보기",
          shareText:
            "나는 ‘알뜰폰 빠꼼이형’ 나왔어요.\n프로모션 끝나는 날짜까지 기억하는 타입.",
          rarity: 18,
          sniper: [
            "프로모션이 끝나는 날짜를 정확히 기억한다",
            "월요금이 아니라 ‘실제 체감가’를 계산해서 비교한다",
            "조건만 좋으면 오늘 당장 갈아탈 준비가 돼 있다",
          ],
          match: {
            code: "REWARD_OPTIMIZER",
            note: "이득 앞에 죽이 척척 맞는, 사실상 최강 절약 콤비",
          },
          clash: {
            code: "PLAN_NEGLECTER",
            note: "왜 안 바꾸고 손해를 보는지 도무지 이해가 안 됨",
          },
        },
      };

      const app = document.querySelector("#app");
      const toast = document.querySelector("#toast");
      let toastTimer;
      let landingTracked = false;
      let resultViewedTracked = false;
      // render()가 이 아래에서 바로 호출되므로, 프리로드 플래그도 여기서 초기화해야 한다.
      // 함수 근처에 두면 아직 초기화 전이라 접근 시 ReferenceError가 난다.
      let questionImagesPreloaded = false;
      let state = createInitialState();

      app.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;

        const action = target.dataset.action;

        if (action === "start") {
          state = {
            ...createInitialState(),
            view: "question",
            motionClass: "card-enter",
          };
          trackEvent("test_started", { runId: state.runId });
          render();
        }

        if (action === "answer") {
          chooseAnswer(Number(target.dataset.answerIndex));
        }

        if (action === "home") {
          state = { ...createInitialState(), motionClass: "card-enter" };
          resultViewedTracked = false;
          render();
        }

        if (action === "previous") {
          if (state.currentStep === 0) {
            state = { ...state, view: "landing", motionClass: "card-enter" };
          } else {
            state = {
              ...state,
              currentStep: state.currentStep - 1,
              motionClass: "card-enter",
            };
          }
          render();
        }

        if (action === "restart") {
          state = { ...createInitialState(), motionClass: "card-enter" };
          resultViewedTracked = false;
          render();
        }

        if (action === "detail") {
          const willOpen = !state.detailOpen;
          state = { ...state, detailOpen: willOpen };
          render();
          trackEvent(
            "result_detail_toggled",
            buildInteractionPayload({ open: willOpen }),
          );
          if (willOpen) {
            const reduce = window.matchMedia(
              "(prefers-reduced-motion: reduce)",
            ).matches;
            window.requestAnimationFrame(() => {
              document.getElementById("result-detail")?.scrollIntoView({
                behavior: reduce ? "auto" : "smooth",
                block: "start",
              });
            });
          }
        }

        if (action === "share") {
          shareResult();
        }

        if (action === "save-image") {
          saveResultImage();
        }

        if (action === "plans") {
          handlePlanClick();
        }
      });

      render();

      // 공유 링크로 들어와도 항상 랜딩에서 시작합니다. 예전에는 ?result=CODE를 읽어
      // 친구의 결과 화면을 바로 띄웠는데, 그 상태에서 '다시 테스트하기'를 누르면
      // 이 함수가 URL의 result를 다시 읽어 같은 결과를 만들어 내 버튼이 먹지 않았습니다.
      function createInitialState() {
        return {
          view: "landing",
          runId: createRunId(),
          currentStep: 0,
          answers: [],
          scores: createEmptyScores(),
          signals: {},
          result: null,
          resultScores: {},
          detailOpen: false,
          motionClass: "",
        };
      }

      function createEmptyScores() {
        return AXES.reduce((scores, axis) => {
          scores[axis] = 0;
          return scores;
        }, {});
      }

      function createEmptySignals() {
        return {};
      }

      function chooseAnswer(answerIndex) {
        const question = questions[state.currentStep];
        const answer = question.answers[answerIndex];
        const nextAnswers = state.answers.slice(0, state.currentStep);
        nextAnswers[state.currentStep] = {
          questionId: question.id,
          answerKey: answer.key,
          answerText: answer.text,
        };

        trackEvent("question_answered", {
          runId: state.runId,
          questionId: question.id,
          answerKey: answer.key,
          step: state.currentStep + 1,
        });

        if (state.currentStep === questions.length - 1) {
          const calculated = calculateResult(nextAnswers);
          state = {
            ...state,
            answers: nextAnswers,
            scores: calculated.scores,
            signals: calculated.signals,
            resultScores: calculated.resultScores,
            result: calculated.resultCode,
            view: "loading",
            motionClass: "card-enter",
          };
          trackEvent(
            "test_completed",
            buildCompletionPayload(calculated, nextAnswers),
          );
          render();
          window.setTimeout(() => {
            state = { ...state, view: "result", motionClass: "card-enter" };
            render();
          }, 900);
          return;
        }

        state = {
          ...state,
          answers: nextAnswers,
          currentStep: state.currentStep + 1,
          motionClass: "card-enter",
        };
        render();
      }

      function calculateResult(answers) {
        const scores = createEmptyScores();
        const signals = createEmptySignals();

        answers.forEach((item) => {
          const question = questions.find(
            (candidate) => candidate.id === item.questionId,
          );
          const answer = question.answers.find(
            (candidate) => candidate.key === item.answerKey,
          );

          AXES.forEach((axis) => {
            scores[axis] += answer.score[axis] || 0;
          });

          Object.entries(answer.signal || {}).forEach(([key, value]) => {
            signals[key] = (signals[key] || 0) + value;
          });
        });

        const normalized = normalizeScores(scores);
        // 계수는 65,536개 답변 조합 전수 시뮬레이션으로 튜닝됨.
        // 각 유형의 rarity 값(12~22%)과 실제 분포가 일치하도록 맞췄다.
        const resultScores = {
          WIFI_MINIMALIST:
            (6 - normalized.dataNeed) * 0.97 + normalized.priceSensitivity * 0.5 + (signals.lowData || 0) * 1.22,
          SHORT_FORM_HEAVY_USER:
            normalized.dataNeed * 0.98 + (signals.videoHeavy || 0) * 1.66,
          PLAN_NEGLECTER:
            (5 - normalized.awareness) * 0.72 + (5 - normalized.switchingPropensity) * 0.45 + (signals.neglect || 0) * 1.28 + (signals.friction || 0) * 0.38,
          REWARD_OPTIMIZER:
            normalized.rewardSensitivity * 1.86 + (signals.reward || 0) * 1.8,
          UNLIMITED_STABILITY_SEEKER:
            normalized.dataNeed * 1.01 + (signals.unlimited || 0) * 1.43 + (signals.stabilityConcern || 0) * 1.26,
          MVNO_POWER_USER:
            normalized.priceSensitivity * 0.61 + normalized.switchingPropensity * 0.67 + normalized.awareness * 0.34 + (signals.promoHunter || 0) * 1.08,
        };

        const maxScore = Math.max(...Object.values(resultScores));
        const resultCode = RESULT_PRIORITY.find(
          (code) => resultScores[code] === maxScore,
        );

        return {
          scores: normalized,
          signals,
          resultScores,
          resultCode,
        };
      }

      function normalizeScores(rawScores) {
        const ranges = {
          dataNeed: [0, 12],
          priceSensitivity: [0, 15],
          rewardSensitivity: [0, 9],
          switchingPropensity: [-5, 9],
          awareness: [-7, 14],
        };

        return AXES.reduce((scores, axis) => {
          const [min, max] = ranges[axis];
          const value = Math.round(((rawScores[axis] - min) / (max - min)) * 5);
          scores[axis] = Math.min(5, Math.max(1, value || 1));
          return scores;
        }, {});
      }

      function render() {
        if (state.view === "landing") {
          app.innerHTML = renderWithBrand(renderLanding());
          preloadQuestionImages();
          if (!landingTracked) {
            landingTracked = true;
            trackEvent("test_landing_viewed", { runId: state.runId });
          }
        }

        if (state.view === "question") {
          app.innerHTML = renderWithBrand(renderQuestion());
        }

        if (state.view === "loading") {
          app.innerHTML = renderWithBrand(renderLoading());
        }

        if (state.view === "result") {
          app.innerHTML = renderWithBrand(renderResult());
          if (!resultViewedTracked) {
            resultViewedTracked = true;
            trackEvent("result_viewed", buildInteractionPayload());
          }
        }

        if (state.motionClass) {
          state = { ...state, motionClass: "" };
        }
      }

      function getPanelClass(extra = "") {
        return ["panel", extra, state.motionClass].filter(Boolean).join(" ");
      }

      function renderWithBrand(panelMarkup) {
        return `${panelMarkup}${renderBrandFooter()}`;
      }

      function renderBrandFooter() {
        return `
        <div class="brand-footer" aria-hidden="true">

        if (!SOCIAL_PROOF_COUNT || SOCIAL_PROOF_COUNT < 1) return "";
        const rounded =
          SOCIAL_PROOF_COUNT >= 1000

            : String(SOCIAL_PROOF_COUNT);
        return `<p class="social-proof">🔥 지금까지 ${rounded}명이 자기 타입을 확인했어요</p>`;

      function renderQuizTeaser(step) {
        if (step < questions.length - 2) return "";
        const remaining = questions.length - step;
        const message =
          remaining <= 1
            ? "마지막 질문이에요! 타입이 거의 다 잡혔어요"
            : "거의 다 왔어요 · 벌써 당신의 타입이 보이기 시작해요";
        return `<p class="quiz-teaser">${message}</p>`;
      }

      function rarityLabel(rarity) {
        if (!rarity) return "";
        return rarity <= 15
          ? `상위 <b>${rarity}%</b> 희귀 타입이에요`

      function renderLanding() {
        return `
        <section class="${getPanelClass("landing")}" aria-labelledby="landing-title">

              나는 데이터 야수일까, 알뜰폰 빠꼼일까?

      function renderQuestion() {
        const question = questions[state.currentStep];
        const step = state.currentStep + 1;
        const progress = Math.round((step / questions.length) * 100);
        const previousAnswer = state.answers[state.currentStep]?.answerKey;

        return `
        <section class="${getPanelClass("screen question-layout")}" aria-labelledby="question-title">
          <div class="progress-sticky">
            <div class="progress-head">
              <span>질문 ${String(step).padStart(2, "0")}</span>
              <span>${step} / ${questions.length}</span>
            </div>
            <div class="progress-bar" role="progressbar" aria-label="진행률" aria-valuemin="1" aria-valuemax="${questions.length}" aria-valuenow="${step}" style="--progress: ${progress}%">
              <span></span>
            </div>

              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">

          ${renderQuizTeaser(step)}

      function renderLoading() {
        return `
        <section class="${getPanelClass("screen loading-layout")}" aria-labelledby="loading-title">
          <div class="loading-card">

            <p class="eyebrow">분석 중</p>

              <li>뷔페 접시에서 쓰는 양 읽는 중</li>

      function renderResult() {
        const result = results[state.result];
        const scores = state.answers.length ? state.scores : result.stats;
        const open = Boolean(state.detailOpen);

        return `
        <section class="${getPanelClass("result")}" aria-labelledby="result-title">
          <div class="result-summary">
            ${renderResultCharacter(result.code)}
            <h1 class="result-title" id="result-title">${result.title}</h1>
            <p class="meme-copy">${result.meme}</p>
             <div class="summary-badges">
              ${result.rarity ? `<span class="rarity-badge">${rarityLabel(result.rarity)}</span>` : ""}
            </div>
            <div class="summary-actions">
              <button class="primary-btn" type="button" data-action="detail" aria-expanded="${open}" aria-controls="result-detail">
                ${open ? "간단히 보기" : "결과 자세히 보기"}
              </button>
              <div class="summary-share">
                <button class="secondary-btn" type="button" data-action="share">친구에게 공유하기</button>
                <button class="ghost-btn" type="button" data-action="restart">다시 테스트하기</button>
              </div>
            </div>
          </div>
          ${open ? renderResultDetail(result, scores) : ""}
        </section>
      `;
      }

      // 응답에서 읽힌 성향을 짧은 문장으로 요약한다.
      // 문항별로 근거를 나열하면 채점표를 보여주는 꼴이라, 결론만 남긴다.
      function buildTraits(scores, signals, limit = 3) {
        const sig = (key) => signals[key] || 0;
        // rank: 클수록 그 사람을 잘 설명하는 특징. 축은 중앙(3)에서 벗어난 정도로,
        // 신호는 쌓인 크기 그대로 재서 비교한다.
        const axis = (value) => Math.abs(value - 3) * 2;

        return [
          { on: sig("videoHeavy") >= 4, rank: sig("videoHeavy"), text: "한번 보기 시작하면 시간 감각이 사라지는 사람" },
          { on: sig("neglect") >= 4, rank: sig("neglect"), text: "바꿔야지 생각만 하고 미뤄둔 게 있는 사람" },
          { on: sig("promoHunter") >= 4, rank: sig("promoHunter"), text: "이득인지 아닌지 숫자로 따져보는 사람" },
          { on: sig("unlimited") >= 4, rank: sig("unlimited"), text: "모자란 것보다 넉넉한 쪽이 마음 편한 사람" },
          { on: sig("lowData") >= 4, rank: sig("lowData"), text: "적게 써도 아쉬울 게 없는 사람" },
          { on: sig("reward") >= 3, rank: sig("reward") + 1, text: "챙길 수 있는 혜택은 놓치지 않는 사람" },
          { on: sig("friction") >= 3, rank: sig("friction") + 1, text: "절차가 길어지면 그 자리에서 마음이 식는 사람" },
          { on: sig("stabilityConcern") >= 3, rank: sig("stabilityConcern") + 1, text: "모자랄까 봐 미리 넉넉히 잡아두는 사람" },
          { on: sig("balancedData") >= 4, rank: sig("balancedData"), text: "쓸 만큼만 쓰고 선을 지키는 사람" },
          { on: scores.awareness <= 2, rank: axis(scores.awareness), text: "내 것이 어떤 상태인지 크게 신경 쓰지 않고 지내온 사람" },
          { on: scores.awareness >= 4, rank: axis(scores.awareness), text: "내 것이 어떤 상태인지 정확히 아는 사람" },
          { on: scores.switchingPropensity <= 2, rank: axis(scores.switchingPropensity), text: "굳이 바꾸느니 그냥 두는 쪽을 택하는 사람" },
          { on: scores.switchingPropensity >= 4, rank: axis(scores.switchingPropensity), text: "조건이 좋으면 바로 움직이는 사람" },
          { on: scores.priceSensitivity >= 4, rank: axis(scores.priceSensitivity), text: "가격표부터 확인하고 시작하는 사람" },
          { on: scores.dataNeed >= 4, rank: axis(scores.dataNeed), text: "필요할 때 마음껏 쓰는 쪽이 편한 사람" },
        ]
          .filter((trait) => trait.on)
          .sort((a, b) => b.rank - a.rank)
          .slice(0, limit)
          .map((trait) => trait.text);
      }

      // 문항 이미지는 그 문항이 렌더될 때 처음 받아오기 때문에, 네트워크 환경에서는
      // 문항을 넘길 때마다 일러스트가 한 박자 늦게 뜬다. 랜딩에서 미리 받아둔다(8개 합쳐 약 12KB).
      function preloadQuestionImages() {
        if (questionImagesPreloaded) return;
        questionImagesPreloaded = true;
        Object.values(QUESTION_IMAGE_SLOTS).forEach((src) => {
          const image = new Image();
          image.decoding = "async";
          image.src = src;
        });
      }

      function formatWon(value) {
        return `${value.toLocaleString("ko-KR")}원`;
      }

      // 데이터 제공량 한 줄. 없는 값은 문장에서 통째로 빠진다.
      function formatDataLine(plan) {
        const parts = [];
        if (plan.dataGb != null) parts.push(`월 ${plan.dataGb}GB`);
        if (plan.dailyGb != null) parts.push(`매일 ${plan.dailyGb}GB`);
        const amount = parts.join(" + ");
        return plan.throttle != null
          ? `${amount} · 소진 후 ${plan.throttle}Mbps 무제한`
          : amount;
      }

      function renderPlanRecommendations(result) {
        const plans = PLAN_RECOMMENDATIONS[result.code] || [];
        if (!plans.length) return "";

        return `
          <section class="section" aria-labelledby="plan-title">
            <h2 id="plan-title">${result.title}에게 어울리는 요금제</h2>
            <div class="plan-list">
              ${plans
                .map(
                  (plan) => `
                <a class="plan-card" href="${plan.url}" target="_blank" rel="noopener">
                  <span class="plan-name">${plan.name}</span>
                  <span class="plan-tags">
                    <span>${plan.network}</span>
                    ${plan.contract === 0 ? "<span>무약정</span>" : ""}
                  </span>
                  <span class="plan-price">
                    ${
                      plan.promo != null
                        ? `<b>${plan.promoMonths}개월 ${formatWon(plan.promo)}</b>
                           <span class="plan-after">이후 ${formatWon(plan.price)}</span>`
                        : `<b>월 ${formatWon(plan.price)}</b>`
                    }
                  </span>
                  <span class="plan-spec">${formatDataLine(plan)}${plan.voice ? " · 음성·문자 무제한" : ""}</span>
                  ${
                    plan.throttle == null
                      ? `<span class="plan-caution">데이터를 다 쓰면 추가 요금이 붙어요</span>`
                      : ""
                  }
                  ${plan.benefit ? `<span class="plan-benefit">${plan.benefit}</span>` : ""}
                  <span class="plan-more">자세히 보기 →</span>
                </a>
              `,
                )
                .join("")}
            </div>
          </section>
        `;
      }
      function renderResultDetail(result, scores) {
        return `
        <div class="result-detail result-body" id="result-detail">
          <p class="description">${result.description}</p>

          ${
            result.sniper?.length
              ? `
          <section class="section" aria-labelledby="sniper-title">
            <h2 id="sniper-title">혹시 이런 사람?</h2>
            <ul class="sniper-list">
              ${result.sniper.map((item) => `<li>${item}</li>`).join("")}
            </ul>
          </section>
          `
              : ""
          }

          ${
            result.match || result.clash
              ? `
          <section class="section" aria-labelledby="match-title">
            <h2 id="match-title">이 타입의 궁합</h2>
            <div class="match-grid">
              ${
                result.match && results[result.match.code]
                  ? `
              <div class="match-card is-match">
                <span class="match-role">💚 찰떡궁합</span>
                <span class="match-name">${results[result.match.code].title}</span>
                <span class="match-note">${result.match.note}</span>
              </div>
              `
                  : ""
              }
              ${
                result.clash && results[result.clash.code]
                  ? `
              <div class="match-card is-clash">
                <span class="match-role">💥 상극</span>
                <span class="match-name">${results[result.clash.code].title}</span>
                <span class="match-note">${result.clash.note}</span>
              </div>
              `
                  : ""
              }
            </div>
          </section>
          `
              : ""
          }

          <section class="section" aria-labelledby="gallery-title">
            <h2 id="gallery-title">다른 타입은 뭐가 있을까?</h2>
            <div class="type-swiper">
              ${Object.keys(results)
                .map(
                  (code) => `
                <div class="type-card ${code === result.code ? "is-current" : ""}">
                  ${code === result.code ? `<span class="tc-mine">내 타입</span>` : ""}
                  <div class="tc-thumb">
                    <img src="${RESULT_IMAGE_SLOTS[code]}" alt="" loading="lazy" decoding="async"
                      onerror="this.classList.add('is-missing'); this.removeAttribute('src');">
                  </div>
                  <span class="tc-code">${results[code].shortCode}</span>
                  <span class="tc-name">${results[code].title}</span>
                  <span class="tc-meme">${results[code].meme}</span>
                </div>
              `,
                )
                .join("")}
            </div>
          </section>

          ${renderPlanRecommendations(result)}

          <section class="result-cta" aria-labelledby="result-cta-title">
            <h2 id="result-cta-title">${result.cta}</h2>
            <p>마일스클럽에서 당신과 잘 맞는 요금제를 만나보세요!</p>
            <button class="primary-btn" type="button" data-action="plans">내게 맞는 요금제 보기</button>
          </section>
          
          <div class="compact-actions">
            <button class="ghost-btn" type="button" data-action="save-image">이미지 저장</button>
            <button class="ghost-btn" type="button" data-action="restart">다시 테스트하기</button>
          </div>
        </div>
      `;
      }

      function renderQuestionVisual(question) {
        const imageSrc =
          QUESTION_IMAGE_SLOTS[question.visual] || QUESTION_IMAGE_SLOTS.buffet;
        return `
        <div class="question-visual" aria-hidden="true" data-image-slot="${question.id}">
          <img
            class="question-image"
            src="${imageSrc}"
            alt=""
            loading="eager"
            decoding="async"
            onerror="this.classList.add('is-missing'); this.removeAttribute('src');"
          >
        </div>
      `;
      }

      function renderResultCharacter(resultCode) {
        const imageSrc =
          RESULT_IMAGE_SLOTS[resultCode] || RESULT_IMAGE_SLOTS.PLAN_NEGLECTER;

        return `
        <div class="result-character" aria-hidden="true" data-image-slot="${resultCode}">
          <img
            class="result-image"
            src="${imageSrc}"
            alt=""
            loading="eager"
            decoding="async"
            onerror="this.classList.add('is-missing'); this.removeAttribute('src');"
          >
        </div>
      `;
      }

      async function shareResult() {
        const result = results[state.result];
        const shareUrl = getResultShareUrl();
        const text = `${result.shareText}\n\n너는 무슨 타입인지 해봐: ${shareUrl}`;
        trackEvent(
          "result_shared",
          buildInteractionPayload({ channel: "native_or_clipboard" }),
        );

        if (navigator.share) {
          try {
            await navigator.share({
              title: `${result.title} | 내 요금제는 무슨 타입?`,
              text: result.shareText,
              url: shareUrl,
            });
            return;
          } catch (error) {
            if (error.name === "AbortError") return;
          }
        }

        try {
          await copyText(text);
          showToast("결과 공유 문구가 복사됐어요");
        } catch (error) {
          showToast("복사가 어려워요. 공유 링크 복사를 이용해 주세요.");
        }
      }

      async function saveResultImage() {
        const result = results[state.result];
        trackEvent(
          "result_image_saved",
          buildInteractionPayload({ resultType: result.code }),
        );

        try {
          const blob = await createResultImageBlob(result);
          downloadBlob(blob, `milesclub-${result.code}.png`);
          showToast("결과 이미지가 저장됐어요");
        } catch (error) {
          showToast("이미지 생성이 어려워요. 결과 공유하기를 이용해 주세요.");
        }
      }

      function handlePlanClick() {
        const result = results[state.result];
        trackEvent(
          "plan_cta_clicked",
          buildInteractionPayload({ resultType: result.code }),
        );

        if (PLAN_DETAIL_URL === "#") {
          showToast("요금제 상세 페이지 주소를 연결하면 여기서 전환됩니다.");
          return;
        }

        const url = new URL(PLAN_DETAIL_URL, window.location.href);
        url.searchParams.set("utm_source", "plan_type_test");
        url.searchParams.set("utm_medium", "result_cta");
        url.searchParams.set("utm_campaign", "plan_type_test");
        url.searchParams.set("utm_content", result.code);
        url.searchParams.set("resultType", result.code);
        url.searchParams.set("version", CONTENT_VERSION);
        window.location.href = url.toString();
      }

      function getBaseUrl() {
        try {
          const url = new URL(window.location.href);
          url.search = "";
          url.hash = "";
          return url.toString();
        } catch (error) {
          return window.location.href.split("?")[0].split("#")[0];
        }
      }

      function getShareUrl() {
        const url = new URL(getBaseUrl());
        url.searchParams.set("utm_source", "share");
        url.searchParams.set("utm_campaign", "plan_type_test");
        return url.toString();
      }

      // 결과 공유는 유형별 공유 페이지(s/CODE.html)로 — 카톡/SNS 미리보기에 유형별
      // OG 카드가 뜨도록. 링크를 연 사람은 그 페이지에서 랜딩으로 넘어가 직접 테스트합니다.
      function getResultShareUrl() {
        if (!state.result) return getShareUrl();
        const url = new URL(`s/${state.result}.html`, getBaseUrl());
        url.searchParams.set("utm_source", "share");
        url.searchParams.set("utm_campaign", "plan_type_test");
        return url.toString();
      }

      function buildCompletionPayload(calculated, answers) {
        return {
          runId: state.runId,
          contentVersion: CONTENT_VERSION,
          resultType: calculated.resultCode,
          resultTitle: results[calculated.resultCode].title,
          scores: calculated.scores,
          resultScores: calculated.resultScores,
          answers: answers.map((answer) => ({
            questionId: answer.questionId,
            answer: answer.answerKey,
          })),
          utm: getUtmParams(),
        };
      }

      function buildInteractionPayload(extra = {}) {
        return {
          runId: state.runId,
          contentVersion: CONTENT_VERSION,
          resultType: state.result,
          resultTitle: state.result ? results[state.result].title : null,
          utm: getUtmParams(),
          ...extra,
        };
      }

      function getUtmParams() {
        const params = new URLSearchParams(window.location.search);
        return [
          "utm_source",
          "utm_medium",
          "utm_campaign",
          "utm_content",
          "utm_term",
        ].reduce((utm, key) => {
          if (params.has(key)) {
            utm[key] = params.get(key);
          }
          return utm;
        }, {});
      }

      function trackEvent(eventName, payload = {}) {
        const event = {
          eventName,
          occurredAt: new Date().toISOString(),
          contentVersion: CONTENT_VERSION,
          ...payload,
        };

        persistEvent(event);

        if (!ANALYTICS_ENDPOINT) return;

        const body = JSON.stringify(event);
        if (navigator.sendBeacon) {
          navigator.sendBeacon(
            ANALYTICS_ENDPOINT,
            new Blob([body], { type: "application/json" }),
          );
          return;
        }

        fetch(ANALYTICS_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
          keepalive: true,
        }).catch(() => {});
      }

      function persistEvent(event) {
        try {
          const key = "milesclub-plan-type-test-events";
          const previous = JSON.parse(localStorage.getItem(key) || "[]");
          localStorage.setItem(
            key,
            JSON.stringify([...previous, event].slice(-40)),
          );
        } catch (error) {
          // Local QA logging is best-effort only.
        }
      }

      // 캐릭터 SVG는 data URI로 바꿔서 그립니다. 캔버스가 오염되지 않아 toBlob이 항상 성공하고,
      // file:// 로 열어 fetch가 막히는 경우엔 null을 돌려 캐릭터 없이 저장됩니다.
      async function loadResultCharacter(resultCode) {
        const src = RESULT_IMAGE_SLOTS[resultCode];
        if (!src) return null;

        try {
          const response = await fetch(src);
          if (!response.ok) return null;
          let markup = await response.text();
          // viewBox만 있는 SVG는 일부 브라우저에서 drawImage 크기를 못 잡습니다.
          if (!/<svg[^>]*\swidth=/.test(markup)) {
            markup = markup.replace(/<svg\b/, '<svg width="240" height="240"');
          }
          const dataUri = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(markup)}`;

          return await new Promise((resolve) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => resolve(null);
            image.src = dataUri;
          });
        } catch (error) {
          return null;
        }
      }

      async function createResultImageBlob(result) {
        if (document.fonts?.ready) {
          await document.fonts.ready;
        }

        const character = await loadResultCharacter(result.code);
        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1350;
        const ctx = canvas.getContext("2d");
        ctx.textBaseline = "alphabetic";

        // 배경: 라임 그라디언트
        const bg = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        bg.addColorStop(0, "#eaffd4");
        bg.addColorStop(1, "#7fd42a");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 카드
        const cardX = 66;
        const cardW = 948;
        ctx.fillStyle = "#ffffff";
        roundRect(ctx, cardX, 70, cardW, 1210, 56);
        ctx.fill();
        ctx.fillStyle = "#58cc02";
        roundRect(ctx, cardX, 70, cardW, 30, 15);
        ctx.fill();

        const padX = cardX + 64;
        const contentW = cardW - 128;
        let y = 200;

        // 캐릭터: 카드 우측 상단. 아래 타이틀(y≈386)보다 위에서 끝나 겹치지 않습니다.
        if (character) {
          const size = 180;
          const charX = cardX + cardW - 64 - size;
          const charY = 170;
          ctx.fillStyle = "#f2ffe4";
          ctx.beginPath();
          ctx.arc(
            charX + size / 2,
            charY + size / 2,
            size / 2 + 12,
            0,
            Math.PI * 2,
          );
          ctx.fill();
          ctx.drawImage(character, charX, charY, size, size);
        }

        // 상단 라벨
        ctx.fillStyle = "#46a302";
        ctx.font = "700 34px NationalPension, system-ui, sans-serif";
        ctx.fillText("마일스클럽 요금제 타입 테스트", padX, y);
        y += 30;

        // 희귀도 배지
        if (result.rarity) {
          const badgeText =
            result.rarity <= 15
              ? `상위 ${result.rarity}% 희귀 타입`
              : `참여자 ${result.rarity}%가 이 타입`;
          drawCanvasPill(
            ctx,
            padX,
            y,
            badgeText,
            "#26382b",
            "#c9ff8f",
            "800 32px NationalPension, system-ui, sans-serif",
          );
          y += 96;
        } else {
          y += 24;
        }

        // 타이틀
        ctx.fillStyle = "#243024";
        ctx.font = "800 84px NationalPension, system-ui, sans-serif";
        y = drawWrappedCanvasText(
          ctx,
          result.title,
          padX,
          y + 60,
          contentW,
          96,
        );
        y += 24;

        // 밈 카피 (말풍선)
        ctx.font = "700 42px NationalPension, system-ui, sans-serif";
        const memeLines = wrapCanvasLines(
          ctx,
          `“${result.meme}”`,
          contentW - 56,
        );
        const memeBoxH = memeLines.length * 56 + 56;
        ctx.fillStyle = "#f2ffe4";
        roundRect(ctx, padX, y, contentW, memeBoxH, 28);
        ctx.fill();
        ctx.fillStyle = "#3f8f00";
        memeLines.forEach((line, i) =>
          ctx.fillText(line, padX + 28, y + 68 + i * 56),
        );
        y += memeBoxH + 44;

        // 저격 체크리스트
        if (result.sniper?.length) {
          ctx.fillStyle = "#46a302";
          ctx.font = "800 34px NationalPension, system-ui, sans-serif";
          ctx.fillText("혹시 이런 사람?", padX, y);
          y += 56;
          ctx.font = "700 36px NationalPension, system-ui, sans-serif";
          result.sniper.forEach((item) => {
            ctx.fillStyle = "#58cc02";
            ctx.fillText("✓", padX, y);
            ctx.fillStyle = "#3a463a";
            const lines = wrapCanvasLines(ctx, item, contentW - 52);
            lines.forEach((line, i) =>
              ctx.fillText(line, padX + 52, y + i * 48),
            );
            y += lines.length * 48 + 14;
          });
          y += 18;
        }

        // 하단 절약 훅 스트립
        ctx.fillStyle = "#58cc02";
        roundRect(ctx, padX, y, contentW, 92, 46);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 38px NationalPension, system-ui, sans-serif";
        ctx.fillText("내 요금제는 무슨 타입?", padX + 40, y + 58);

        // 푸터
        ctx.fillStyle = "#5b6b52";
        ctx.font = "700 30px NationalPension, system-ui, sans-serif";
        ctx.fillText("마일스클럽 · 30초 타입 테스트", padX, 1228);

        return new Promise((resolve, reject) => {
          canvas.toBlob(
            (blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error("image generation failed"));
              }
            },
            "image/png",
            0.95,
          );
        });
      }

      function drawCanvasPill(ctx, x, y, text, bg, fg, font) {
        ctx.font = font;
        const padInner = 28;
        const height = 62;
        const width = ctx.measureText(text).width + padInner * 2;
        ctx.fillStyle = bg;
        roundRect(ctx, x, y, width, height, height / 2);
        ctx.fill();
        ctx.fillStyle = fg;
        const prevBaseline = ctx.textBaseline;
        ctx.textBaseline = "middle";
        ctx.fillText(text, x + padInner, y + height / 2 + 2);
        ctx.textBaseline = prevBaseline;
        return width;
      }

      function roundRect(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function wrapCanvasLines(ctx, text, maxWidth) {
        const lines = [];
        String(text)
          .split("\n")
          .forEach((paragraph) => {
            let line = "";
            for (const ch of paragraph) {
              const test = line + ch;
              if (ctx.measureText(test).width > maxWidth && line) {
                lines.push(line);
                line = ch === " " ? "" : ch;
              } else {
                line = test;
              }
            }
            lines.push(line);
          });
        return lines;
      }

      function drawWrappedCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
        const lines = wrapCanvasLines(ctx, text, maxWidth);
        lines.forEach((line, index) => {
          ctx.fillText(line, x, y + index * lineHeight);
        });
        return y + lines.length * lineHeight;
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
        URL.revokeObjectURL(url);
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }

        return new Promise((resolve, reject) => {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.setAttribute("readonly", "");
          textArea.style.position = "fixed";
          textArea.style.top = "-1000px";
          textArea.style.opacity = "0";
          document.body.appendChild(textArea);
          textArea.select();

          const copied = document.execCommand("copy");
          document.body.removeChild(textArea);

          if (copied) {
            resolve();
          } else {
            reject(new Error("copy failed"));
          }
        });
      }

      function createRunId() {
        if (window.crypto?.randomUUID) {
          return window.crypto.randomUUID();
        }
        return `run-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          toast.classList.remove("is-visible");
        }, 2200);
      }
    </script>
  </body>
</html>
