<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
 <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaffd4"/><stop offset="1" stop-color="#7fd42a"/></linearGradient></defs>
 <rect width="1200" height="1200" fill="url(#bg)"/>
 <rect x="48" y="48" width="1104" height="1104" rx="60" fill="#ffffff"/>
 <text x="600" y="128" text-anchor="middle" font-size="30" font-weight="700" fill="#3f8f00">마일스클럽 · 요금제 타입 테스트</text>
 <text x="600" y="182" text-anchor="middle" font-size="34" font-weight="800" fill="#26382b">상위 12% 희귀 타입</text>
 <rect x="380" y="224" width="440" height="430" rx="52" fill="#f2ffe4" stroke="#dbeecb" stroke-width="3"/>
 <g transform="translate(400,240) scale(1.667)"><!-- data draining away -->
  <g fill="#8fce4f">
    <path d="M182 60 q6 9 0 14 a7 7 0 0 1 -12 -4 q0 -5 6 -10 z" opacity="0.9"/>
    <path d="M198 84 q4 6 0 10 a5 5 0 0 1 -8 -3 q0 -3 4 -7 z" opacity="0.6"/>
    <path d="M172 96 q3 5 0 8 a4 4 0 0 1 -7 -2 q0 -3 4 -6 z" opacity="0.4"/>
  </g>
  <!-- shadow -->
  <ellipse cx="120" cy="216" rx="54" ry="10" fill="#26382b" opacity="0.08"/>
  <!-- body -->
  <ellipse cx="120" cy="134" rx="56" ry="60" fill="#7ed42a" stroke="#26382b" stroke-width="6"/>
  <ellipse cx="120" cy="148" rx="38" ry="40" fill="#a6ee5c"/>
  <!-- cheeks -->
  <ellipse cx="92" cy="140" rx="8" ry="5.5" fill="#ffb3a7"/>
  <ellipse cx="148" cy="140" rx="8" ry="5.5" fill="#ffb3a7"/>
  <!-- hypnotized dizzy eyes -->
  <g>
    <circle cx="102" cy="122" r="10" fill="#ffffff" stroke="#26382b" stroke-width="3.5"/>
    <circle cx="102" cy="122" r="5" fill="none" stroke="#26382b" stroke-width="3"/>
    <circle cx="102" cy="122" r="1.6" fill="#26382b"/>
    <circle cx="138" cy="122" r="10" fill="#ffffff" stroke="#26382b" stroke-width="3.5"/>
    <circle cx="138" cy="122" r="5" fill="none" stroke="#26382b" stroke-width="3"/>
    <circle cx="138" cy="122" r="1.6" fill="#26382b"/>
  </g>
  <!-- slack-jawed mouth -->
  <ellipse cx="120" cy="150" rx="6" ry="5.5" fill="#26382b"/>
  <!-- hands -->
  <circle cx="98" cy="180" r="9" fill="#7ed42a" stroke="#26382b" stroke-width="5"/>
  <circle cx="142" cy="180" r="9" fill="#7ed42a" stroke="#26382b" stroke-width="5"/>
  <!-- phone -->
  <rect x="102" y="150" width="36" height="58" rx="9" fill="#33413a" stroke="#26382b" stroke-width="5"/>
  <rect x="108" y="157" width="24" height="44" rx="4" fill="#eaf7ff"/>
  <path d="M116 168 L116 190 L133 179 Z" fill="#46a302"/></g>
 <text x="600" y="742" text-anchor="middle" font-size="84" font-weight="800" fill="#243024">숏폼 데이터</text>
 <text x="600" y="828" text-anchor="middle" font-size="84" font-weight="800" fill="#243024">탕진러</text>
 <rect x="140" y="866" width="920" height="140" rx="34" fill="#f2ffe4"/>
 <text x="600" y="928" text-anchor="middle" font-size="34" font-weight="700" fill="#3f8f00">잠깐만 본다더니 데이터는 이미</text><text x="600" y="974" text-anchor="middle" font-size="34" font-weight="700" fill="#3f8f00">퇴근함</text>
 <text x="600" y="1086" text-anchor="middle" font-size="30" font-weight="700" fill="#5b6b52">내 요금제는 무슨 타입? · 30초 테스트</text>
</svg>