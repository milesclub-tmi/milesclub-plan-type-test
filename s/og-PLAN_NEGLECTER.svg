  <path d="M84 158 Q92 190 116 196" fill="none" stroke="#26382b" stroke-width="6" stroke-linecap="round"/>
  <path d="M156 158 Q148 190 124 196" fill="none" stroke="#26382b" stroke-width="6" stroke-linecap="round"/>
  <!-- retro brick phone -->
  <line x1="128" y1="160" x2="138" y2="138" stroke="#26382b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="139" cy="135" r="4" fill="#ffd23f" stroke="#26382b" stroke-width="3"/>
  <rect x="100" y="162" width="40" height="46" rx="7" fill="#95a889" stroke="#26382b" stroke-width="5"/>
  <rect x="106" y="168" width="28" height="13" rx="3" fill="#cfe0c2" stroke="#26382b" stroke-width="2.5"/>
  <g fill="#26382b">
    <circle cx="111" cy="190" r="2.2"/><circle cx="120" cy="190" r="2.2"/><circle cx="129" cy="190" r="2.2"/>
    <circle cx="111" cy="199" r="2.2"/><circle cx="120" cy="199" r="2.2"/><circle cx="129" cy="199" r="2.2"/>
  </g></g>
 <text x="600" y="742" text-anchor="middle" font-size="84" font-weight="800" fill="#243024">화석 요금제</text>
 <text x="600" y="828" text-anchor="middle" font-size="84" font-weight="800" fill="#243024">지킴이</text>
 <rect x="140" y="866" width="920" height="94" rx="34" fill="#f2ffe4"/>
 <text x="600" y="928" text-anchor="middle" font-size="34" font-weight="700" fill="#3f8f00">요금제도 유물처럼 보존 중</text>
 <text x="600" y="1086" text-anchor="middle" font-size="30" font-weight="700" fill="#5b6b52">내 요금제는 무슨 타입? · 30초 테스트</text>
</svg>