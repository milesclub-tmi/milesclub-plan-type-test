<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="내 요금제는 무슨 타입?">
  <!-- floating type emblems -->
  <g stroke="#26382b" stroke-width="3">
    <circle cx="52" cy="34" r="14" fill="#ffd23f"/>
    <g fill="none" stroke="#46a302" stroke-width="3" stroke-linecap="round">
      <path d="M46 36 q6 -6 12 0"/><path d="M43 32 q9 -9 18 0"/>
    </g>
    <rect x="248" y="20" width="26" height="26" rx="7" fill="#dcffbf"/>
    <path d="M256 33 l4 4 8 -8" fill="none" stroke="#46a302" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffd23f">
    <path d="M24 96 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
    <path d="M296 108 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
  </g>
  <!-- shadow -->
  <ellipse cx="132" cy="150" rx="70" ry="8" fill="#26382b" opacity="0.08"/>
  <!-- mascot -->
  <ellipse cx="92" cy="96" rx="46" ry="48" fill="#7ed42a" stroke="#26382b" stroke-width="6"/>
  <ellipse cx="92" cy="108" rx="30" ry="30" fill="#a6ee5c"/>
  <ellipse cx="70" cy="104" rx="7" ry="5" fill="#ffb3a7"/>
  <ellipse cx="112" cy="104" rx="7" ry="5" fill="#ffb3a7"/>
  <circle cx="80" cy="90" r="6" fill="#26382b"/>
  <circle cx="82" cy="88" r="2" fill="#fff"/>
  <circle cx="106" cy="90" r="6" fill="#26382b"/>
  <circle cx="108" cy="88" r="2" fill="#fff"/>
  <path d="M82 108 Q93 120 104 108" fill="none" stroke="#26382b" stroke-width="5" stroke-linecap="round"/>
  <!-- arm holding phone -->
  <path d="M132 108 Q150 108 160 96" fill="none" stroke="#26382b" stroke-width="7" stroke-linecap="round"/>
  <!-- phone with question -->
  <g transform="rotate(-7 202 84)">
    <rect x="166" y="30" width="72" height="108" rx="16" fill="#33413a" stroke="#26382b" stroke-width="6"/>
    <rect x="176" y="42" width="52" height="84" rx="8" fill="#eaf7ff"/>
    <text x="202" y="102" text-anchor="middle" font-family="Verdana, sans-serif" font-size="58" font-weight="700" fill="#46a302">?</text>
  </g>
</svg>
