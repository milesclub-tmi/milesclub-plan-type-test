<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 120" role="img" aria-label="편의점 2+1 행사">
  <defs><linearGradient id="promobg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3ffe6"/><stop offset="1" stop-color="#e2f7cb"/>
  </linearGradient></defs>
  <rect width="312" height="120" fill="url(#promobg)"/>
  <!-- 상품 3개 -->
  <g transform="translate(40 40)">
    <rect x="0" y="0" width="34" height="58" rx="8" fill="#7ed42a" stroke="#26382b" stroke-width="5"/>
    <rect x="0" y="16" width="34" height="12" fill="#dcffbf"/>
    <rect x="0" y="0" width="34" height="58" rx="8" fill="none" stroke="#26382b" stroke-width="5"/>
    <rect x="44" y="0" width="34" height="58" rx="8" fill="#5aa9e8" stroke="#26382b" stroke-width="5"/>
    <rect x="44" y="16" width="34" height="12" fill="#ffffff"/>
    <rect x="44" y="0" width="34" height="58" rx="8" fill="none" stroke="#26382b" stroke-width="5"/>
    <rect x="88" y="0" width="34" height="58" rx="8" fill="#e8604c" stroke="#26382b" stroke-width="5"/>
    <rect x="88" y="16" width="34" height="12" fill="#ffffff"/>
    <rect x="88" y="0" width="34" height="58" rx="8" fill="none" stroke="#26382b" stroke-width="5"/>
  </g>
  <!-- 2+1 태그 -->
  <g transform="translate(190 24)">
    <rect x="0" y="0" width="86" height="48" rx="12" fill="#ffd23f" stroke="#26382b" stroke-width="6"/>
    <text x="43" y="34" text-anchor="middle" font-family="Verdana, sans-serif" font-size="24" font-weight="700" fill="#26382b">2+1</text>
    <path d="M30 48 l10 14 12 -14 z" fill="#ffd23f" stroke="#26382b" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
