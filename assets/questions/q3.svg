<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 120" role="img" aria-label="요금제 광고에서 눈에 들어오는 것">
  <defs><linearGradient id="q3bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3ffe6"/><stop offset="1" stop-color="#e2f7cb"/>
  </linearGradient></defs>
  <rect width="312" height="120" fill="url(#q3bg)"/>
  <!-- ad board -->
  <rect x="70" y="24" width="172" height="66" rx="12" fill="#ffffff" stroke="#26382b" stroke-width="6"/>
  <!-- price coin -->
  <circle cx="104" cy="57" r="17" fill="#ffd23f" stroke="#26382b" stroke-width="5"/>
  <path d="M104 48 v18 M98 54 h12 M98 60 h12" stroke="#26382b" stroke-width="3" stroke-linecap="round"/>
  <!-- data waves -->
  <g fill="none" stroke="#58cc02" stroke-width="5" stroke-linecap="round">
    <path d="M148 66 q8 -14 16 0"/><path d="M143 66 q13 -22 26 0"/>
  </g>
  <circle cx="156" cy="66" r="3" fill="#58cc02"/>
  <!-- gift -->
  <g transform="translate(192 40)">
    <rect x="0" y="8" width="34" height="26" rx="4" fill="#dcffbf" stroke="#26382b" stroke-width="5"/>
    <rect x="0" y="4" width="34" height="10" rx="3" fill="#a6ee5c" stroke="#26382b" stroke-width="5"/>
    <path d="M17 4 V34" stroke="#26382b" stroke-width="4"/>
    <path d="M17 4 Q8 -6 4 4 M17 4 Q26 -6 30 4" fill="none" stroke="#26382b" stroke-width="4"/>
  </g>
  <!-- board stand -->
  <rect x="150" y="90" width="12" height="18" fill="#95a889" stroke="#26382b" stroke-width="4"/>
  <!-- looking eye -->
  <g transform="translate(268 76)">
    <path d="M-16 6 Q0 -8 16 6 Q0 20 -16 6 Z" fill="#fff" stroke="#26382b" stroke-width="5"/>
    <circle cx="0" cy="6" r="6" fill="#26382b"/>
  </g>
</svg>
