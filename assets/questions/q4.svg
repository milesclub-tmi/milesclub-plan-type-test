<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 120" role="img" aria-label="친구가 더 싼 요금제 링크를 보냄">
  <defs><linearGradient id="q4bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3ffe6"/><stop offset="1" stop-color="#e2f7cb"/>
  </linearGradient></defs>
  <rect width="312" height="120" fill="url(#q4bg)"/>
  <!-- left phone -->
  <rect x="40" y="30" width="50" height="76" rx="12" fill="#33413a" stroke="#26382b" stroke-width="6"/>
  <rect x="48" y="40" width="34" height="52" rx="5" fill="#eaf7ff"/>
  <!-- right phone -->
  <rect x="222" y="30" width="50" height="76" rx="12" fill="#33413a" stroke="#26382b" stroke-width="6"/>
  <rect x="230" y="40" width="34" height="52" rx="5" fill="#eaf7ff"/>
