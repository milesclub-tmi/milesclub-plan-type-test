    <path d="M-6 18 L2 30 L8 18 Z" fill="#ffd23f" stroke="#26382b" stroke-width="5" stroke-linejoin="round"/>
    <g fill="none" stroke="#26382b" stroke-width="4" stroke-linecap="round">
