<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="화석 요금제 지킴이">
  <!-- cobweb corner -->
  <g fill="none" stroke="#b9c9ac" stroke-width="2.5" stroke-linecap="round">
    <path d="M40 40 L70 70"/>
    <path d="M40 58 Q55 55 58 40"/>
    <path d="M40 50 Q60 60 66 40"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffd23f">
    <path d="M170 70 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
    <path d="M186 104 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
  </g>
  <!-- shadow -->
  <ellipse cx="120" cy="216" rx="54" ry="10" fill="#26382b" opacity="0.08"/>
  <!-- body -->
  <ellipse cx="120" cy="134" rx="56" ry="60" fill="#7ed42a" stroke="#26382b" stroke-width="6"/>
  <ellipse cx="120" cy="148" rx="38" ry="40" fill="#a6ee5c"/>
  <!-- cheeks -->
  <ellipse cx="90" cy="138" rx="8" ry="5.5" fill="#ffb3a7"/>
  <ellipse cx="150" cy="138" rx="8" ry="5.5" fill="#ffb3a7"/>
  <!-- proud closed eyes -->
  <g fill="none" stroke="#26382b" stroke-width="5" stroke-linecap="round">
    <path d="M92 128 Q99 121 106 128"/>
    <path d="M134 128 Q141 121 148 128"/>
  </g>
  <!-- content smile -->
  <path d="M111 146 Q120 154 129 146" fill="none" stroke="#26382b" stroke-width="5" stroke-linecap="round"/>
  <!-- hugging arms -->
  <path d="M84 158 Q92 190 116 196" fill="none" stroke="#26382b" stroke-width="6" stroke-linecap="round"/>
  <path d="M156 158 Q148 190 124 196" fill="none" stroke="#26382b" stroke-width="6" stroke-linecap="round"/>
  <!-- retro brick phone -->
  <line x1="128" y1="160" x2="138" y2="138" stroke="#26382b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="139" cy="135" r="4" fill="#ffd23f" stroke="#26382b" stroke-width="3"/>
  <rect x="100" y="162" width="40" height="46" rx="7" fill="#95a889" stroke="#26382b" stroke-width="5"/>
  <rect x="106" y="168" width="28" height="13" rx="3" fill="#cfe0c2" stroke="#26382b" stroke-width="2.5"/>
  <g fill="#26382b">
    <circle cx="111" cy="190" r="2.2"/><circle cx="120" cy="190" r="2.2"/><circle cx="129" cy="190" r="2.2"/>
    <circle cx="111" cy="199" r="2.2"/><circle cx="120" cy="199" r="2.2"/><circle cx="129" cy="199" r="2.2"/>
  </g>
</svg>
