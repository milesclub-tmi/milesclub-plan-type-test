<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="데이터 야수형">
  <!-- infinity + lightning -->
  <g fill="none" stroke="#46a302" stroke-width="6">
    <circle cx="156" cy="48" r="8"/>
    <circle cx="172" cy="48" r="8"/>
  </g>
  <path d="M70 40 L60 60 L70 60 L62 80 L84 54 L74 54 L82 40 Z" fill="#ffd23f" stroke="#26382b" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- shadow -->
  <ellipse cx="120" cy="216" rx="56" ry="10" fill="#26382b" opacity="0.08"/>
  <!-- feet -->
  <ellipse cx="102" cy="198" rx="12" ry="8" fill="#63b81e" stroke="#26382b" stroke-width="5"/>
  <ellipse cx="138" cy="198" rx="12" ry="8" fill="#63b81e" stroke="#26382b" stroke-width="5"/>
  <!-- horns -->
  <path d="M86 92 L78 66 L100 84 Z" fill="#63b81e" stroke="#26382b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M154 92 L162 66 L140 84 Z" fill="#63b81e" stroke="#26382b" stroke-width="5" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="120" cy="132" rx="58" ry="60" fill="#7ed42a" stroke="#26382b" stroke-width="6"/>
  <ellipse cx="120" cy="146" rx="40" ry="40" fill="#a6ee5c"/>
  <!-- fierce brows -->
  <path d="M92 112 L112 120" stroke="#26382b" stroke-width="6" stroke-linecap="round"/>
  <path d="M148 112 L128 120" stroke="#26382b" stroke-width="6" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="104" cy="128" r="6.5" fill="#26382b"/>
  <circle cx="136" cy="128" r="6.5" fill="#26382b"/>
  <!-- big confident grin -->
  <path d="M100 146 Q120 168 140 146 Z" fill="#26382b"/>
  <path d="M110 156 Q120 164 130 156 Z" fill="#ff8f7a"/>
  <!-- raised arm holding phone -->
  <path d="M168 128 Q182 112 176 92" fill="none" stroke="#26382b" stroke-width="6" stroke-linecap="round"/>
  <rect x="162" y="70" width="26" height="40" rx="6" fill="#33413a" stroke="#26382b" stroke-width="5" transform="rotate(12 175 90)"/>
  <rect x="167" y="76" width="16" height="26" rx="3" fill="#eaf7ff" transform="rotate(12 175 90)"/>
</svg>
