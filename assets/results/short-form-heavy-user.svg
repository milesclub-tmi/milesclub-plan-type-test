    <path d="M182 60 q6 9 0 14 a7 7 0 0 1 -12 -4 q0 -5 6 -10 z" opacity="0.9"/>
    <path d="M198 84 q4 6 0 10 a5 5 0 0 1 -8 -3 q0 -3 4 -7 z" opacity="0.6"/>
    <path d="M172 96 q3 5 0 8 a4 4 0 0 1 -7 -2 q0 -3 4 -6 z" opacity="0.4"/>
  </g>
  <!-- shadow -->
  <ellipse cx="120" cy="216" rx="54" ry="10" fill="#26382b" opacity="0.08"/>
  <!-- body -->
  <ellipse cx="120" cy="134" rx="56" ry="60" fill="#7ed42a" stroke="#26382b" stroke-width="6"/>
  <ellipse cx="120" cy="148" rx="38" ry="40" fill="#a6ee5c"/>
  <!-- cheeks -->
  <ellipse cx="92" cy="140" rx="8" ry="5.5" fill="#ffb3a7"/>
  <ellipse cx="148" cy="140" rx="8" ry="5.5" fill="#ffb3a7"/>
  <!-- hypnotized dizzy eyes -->
  <g>
    <circle cx="102" cy="122" r="10" fill="#ffffff" stroke="#26382b" stroke-width="3.5"/>
    <circle cx="102" cy="122" r="5" fill="none" stroke="#26382b" stroke-width="3"/>
    <circle cx="102" cy="122" r="1.6" fill="#26382b"/>
    <circle cx="138" cy="122" r="10" fill="#ffffff" stroke="#26382b" stroke-width="3.5"/>
    <circle cx="138" cy="122" r="5" fill="none" stroke="#26382b" stroke-width="3"/>
    <circle cx="138" cy="122" r="1.6" fill="#26382b"/>
  </g>
  <!-- slack-jawed mouth -->
  <ellipse cx="120" cy="150" rx="6" ry="5.5" fill="#26382b"/>
  <!-- hands -->
  <circle cx="98" cy="180" r="9" fill="#7ed42a" stroke="#26382b" stroke-width="5"/>
  <circle cx="142" cy="180" r="9" fill="#7ed42a" stroke="#26382b" stroke-width="5"/>
  <!-- phone -->
  <rect x="102" y="150" width="36" height="58" rx="9" fill="#33413a" stroke="#26382b" stroke-width="5"/>
  <rect x="108" y="157" width="24" height="44" rx="4" fill="#eaf7ff"/>
  <path d="M116 168 L116 190 L133 179 Z" fill="#46a302"/>
